name: Build TWA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          accept-android-sdk-licenses: true

      - name: Install Android build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Restore keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app.keystore
          echo "Keystore restored:"
          keytool -list -v -keystore app.keystore -alias amaltracker -storepass amaltracker123 2>/dev/null | grep "SHA256"

      - name: Build TWA Android project
        run: |
          mkdir -p twa-project/app/src/main/res/values
          mkdir -p twa-project/app/src/main/res/drawable
          mkdir -p twa-project/app/src/main/res/xml
          mkdir -p twa-project/app/src/main/res/mipmap-hdpi
          mkdir -p twa-project/gradle/wrapper

          cat > twa-project/gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > twa-project/settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AmalTracker"
          include ':app'
          EOF

          cat > twa-project/build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          cat > twa-project/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -sL -o twa-project/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar
          curl -sL -o twa-project/gradlew \
            https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew
          chmod +x twa-project/gradlew

          cat > twa-project/app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.qla.amaltracker'
              compileSdk 34
              defaultConfig {
                  applicationId "com.qla.amaltracker"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              signingConfigs {
                  release {
                      storeFile file("../../app.keystore")
                      storePassword "amaltracker123"
                      keyAlias "amaltracker"
                      keyPassword "amaltracker123"
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          EOF

          cat > twa-project/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.NoTitleBar">
                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                      android:exported="true">
                      <meta-data android:name="android.support.customtabs.trusted.DEFAULT_URL"
                          android:value="@string/start_url"/>
                      <meta-data android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR"
                          android:value="@color/colorPrimary"/>
                      <meta-data android:name="android.support.customtabs.trusted.SPLASH_IMAGE_DRAWABLE"
                          android:value="@drawable/splash"/>
                      <meta-data android:name="android.support.customtabs.trusted.SPLASH_SCREEN_BACKGROUND_COLOR"
                          android:value="@color/backgroundColor"/>
                      <meta-data android:name="android.support.customtabs.trusted.SPLASH_SCREEN_FADE_OUT_DURATION"
                          android:value="300"/>
                      <meta-data android:name="android.support.customtabs.trusted.FILE_PROVIDER_AUTHORITY"
                          android:value="com.qla.amaltracker.fileprovider"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.BROWSABLE"/>
                          <data android:scheme="https"
                              android:host="moslem-tracker-30days.netlify.app"/>
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.qla.amaltracker.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/provider_paths"/>
                  </provider>
              </application>
          </manifest>
          EOF

          cat > twa-project/app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">30 Hari Amal Terbaik</string>
              <string name="start_url">https://moslem-tracker-30days.netlify.app/</string>
          </resources>
          EOF

          cat > twa-project/app/src/main/res/values/colors.xml << 'EOF'
          <resources>
              <color name="colorPrimary">#0D3320</color>
              <color name="colorPrimaryDark">#0D3320</color>
              <color name="colorAccent">#C9941A</color>
              <color name="backgroundColor">#0D3320</color>
          </resources>
          EOF

          cat > twa-project/app/src/main/res/drawable/splash.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#0D3320"/>
          </shape>
          EOF

          cat > twa-project/app/src/main/res/xml/provider_paths.xml << 'EOF'
          <paths>
              <external-path name="external_files" path="."/>
          </paths>
          EOF

          cp icon-192.png twa-project/app/src/main/res/mipmap-hdpi/ic_launcher.png 2>/dev/null || \
            curl -sL -o twa-project/app/src/main/res/mipmap-hdpi/ic_launcher.png \
              https://moslem-tracker-30days.netlify.app/icon-192.png

      - name: Build APK
        run: |
          cd twa-project
          ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Find APK
        run: find twa-project -name "*.apk" | head -10

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmalTracker-APK
          path: twa-project/**/*.apk
          retention-days: 90
          if-no-files-found: warn
