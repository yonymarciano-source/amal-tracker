name: Build TWA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          accept-android-sdk-licenses: true

      - name: Install Android build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@latest
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: "true"

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -keystore android.keystore \
            -alias amaltracker \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass amaltracker123 -keypass amaltracker123 \
            -dname "CN=Amal Tracker, O=QLA Channel, L=Jakarta, C=ID"

      - name: Create twa-manifest.json manually
        run: |
          mkdir -p twa-build
          cat > twa-build/twa-manifest.json << 'JSON'
          {
            "packageId": "com.qla.amaltracker",
            "host": "moslem-tracker-30days.netlify.app",
            "name": "30 Hari Amal Terbaik",
            "launcherName": "Amal Tracker",
            "display": "standalone",
            "themeColor": "#0D3320",
            "navigationColor": "#0D3320",
            "navigationColorDark": "#0D3320",
            "navigationDividerColor": "#0D3320",
            "navigationDividerColorDark": "#0D3320",
            "backgroundColor": "#0D3320",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://moslem-tracker-30days.netlify.app/icon-512.png",
            "maskableIconUrl": "https://moslem-tracker-30days.netlify.app/icon-512.png",
            "monochromeIconUrl": "https://moslem-tracker-30days.netlify.app/icon-192.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "../android.keystore",
              "alias": "amaltracker"
            },
            "signingKeyPassword": "amaltracker123",
            "signingStorePassword": "amaltracker123",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "features": {
              "locationDelegation": { "enabled": true }
            },
            "alphaDependencies": { "enabled": false },
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://moslem-tracker-30days.netlify.app/manifest.json",
            "fallbackType": "customtabs",
            "orientation": "portrait",
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "minSdkVersion": 19,
            "targetSdkVersion": 34,
            "sdkPath": "/usr/local/lib/android/sdk",
            "jdkPath": "/usr/lib/jvm/temurin-17-jdk-amd64"
          }
          JSON
          echo "twa-manifest.json created:"
          cat twa-build/twa-manifest.json

      - name: Generate Android project from manifest
        run: |
          cd twa-build
          bubblewrap update \
            --skipPwaValidation \
            --manifest ./twa-manifest.json
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: "true"
          BUBBLEWRAP_ANALYTICS: "false"

      - name: Build APK
        run: |
          cd twa-build
          bubblewrap build \
            --skipPwaValidation
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: "true"
          BUBBLEWRAP_ANALYTICS: "false"
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Find APK
        run: find . -name "*.apk" -o -name "*.aab" | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmalTracker-APK
          path: |
            twa-build/**/*.apk
            twa-build/**/*.aab
          retention-days: 90
          if-no-files-found: warn
