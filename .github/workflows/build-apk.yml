name: Build TWA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          accept-android-sdk-licenses: true

      - name: Install Android build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -keystore app.keystore \
            -alias amaltracker \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass amaltracker123 -keypass amaltracker123 \
            -dname "CN=Amal Tracker, O=QLA Channel, L=Jakarta, C=ID"

      - name: Build TWA project from scratch
        run: |
          # Clone TWA template resmi Google
          git clone --depth 1 https://github.com/GoogleChromeLabs/svgomg-twa.git twa-project
          
          # Update strings.xml - nama app dan host
          cat > twa-project/app/src/main/res/values/strings.xml << 'XML'
          <resources>
              <string name="app_name">30 Hari Amal Terbaik</string>
              <string name="launcher_name">Amal Tracker</string>
              <string name="host">moslem-tracker-30days.netlify.app</string>
              <string name="start_url">/</string>
              <string name="asset_statements">[{\"relation\": [\"delegate_permission/common.handle_all_urls\"], \"target\": {\"namespace\": \"web\", \"site\": \"https://moslem-tracker-30days.netlify.app\"}}]</string>
          </resources>
          XML

          # Update build.gradle - package ID dan versi
          sed -i 's/applicationId ".*"/applicationId "com.qla.amaltracker"/' twa-project/app/build.gradle
          sed -i 's/versionCode [0-9]*/versionCode 1/' twa-project/app/build.gradle
          sed -i 's/versionName ".*"/versionName "1.0.0"/' twa-project/app/build.gradle
          sed -i 's/minSdk [0-9]*/minSdk 19/' twa-project/app/build.gradle
          sed -i 's/targetSdk [0-9]*/targetSdk 34/' twa-project/app/build.gradle
          sed -i 's/compileSdk [0-9]*/compileSdk 34/' twa-project/app/build.gradle

          # Signing config
          cat >> twa-project/app/build.gradle << 'GRADLE'

          android.signingConfigs {
              release {
                  storeFile file("../../app.keystore")
                  storePassword "amaltracker123"
                  keyAlias "amaltracker"
                  keyPassword "amaltracker123"
              }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          GRADLE

          # Update theme color di colors.xml
          cat > twa-project/app/src/main/res/values/colors.xml << 'XML'
          <resources>
              <color name="colorPrimary">#0D3320</color>
              <color name="colorPrimaryDark">#0D3320</color>
              <color name="colorAccent">#C9941A</color>
              <color name="navigationColor">#0D3320</color>
              <color name="backgroundColor">#0D3320</color>
          </resources>
          XML

      - name: Build APK with Gradle
        run: |
          cd twa-project
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PANDROID_HOME=$ANDROID_SDK_ROOT \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: find twa-project -name "*.apk" | head -10

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmalTracker-APK
          path: twa-project/**/*.apk
          retention-days: 90
          if-no-files-found: warn
