name: Build WebView APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          accept-android-sdk-licenses: true

      - name: Install Android build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Restore keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app.keystore

      - name: Build WebView Android project
        run: |
          mkdir -p twa-project/app/src/main/java/com/qla/amaltracker
          mkdir -p twa-project/app/src/main/res/values
          mkdir -p twa-project/app/src/main/res/drawable
          mkdir -p twa-project/app/src/main/res/mipmap-hdpi
          mkdir -p twa-project/app/src/main/res/xml
          mkdir -p twa-project/gradle/wrapper

          # gradle.properties
          cat > twa-project/gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          # settings.gradle
          cat > twa-project/settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AmalTracker"
          include ':app'
          EOF

          # root build.gradle
          cat > twa-project/build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          # gradle wrapper
          cat > twa-project/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -sL -o twa-project/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar
          curl -sL -o twa-project/gradlew \
            https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew
          chmod +x twa-project/gradlew

          # app/build.gradle
          cat > twa-project/app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.qla.amaltracker'
              compileSdk 34
              defaultConfig {
                  applicationId "com.qla.amaltracker"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              signingConfigs {
                  release {
                      storeFile file("../../app.keystore")
                      storePassword "amaltracker123"
                      keyAlias "amaltracker"
                      keyPassword "amaltracker123"
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.8.0'
          }
          EOF

          # AndroidManifest.xml
          cat > twa-project/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="false"
                  android:hardwareAccelerated="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.java
          cat > twa-project/app/src/main/java/com/qla/amaltracker/MainActivity.java << 'EOF'
          package com.qla.amaltracker;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final int LOCATION_PERMISSION_REQUEST = 1;
              private static final int NOTIFICATION_PERMISSION_REQUEST = 2;
              private GeolocationPermissions.Callback geoCallback;
              private String geoOrigin;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setGeolocationEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(true);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("https://yonymarciano-source.github.io/amal-tracker")) {
                              return false;
                          }
                          return false;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin,
                              GeolocationPermissions.Callback callback) {
                          geoOrigin = origin;
                          geoCallback = callback;
                          if (ContextCompat.checkSelfPermission(MainActivity.this,
                                  Manifest.permission.ACCESS_FINE_LOCATION)
                                  == PackageManager.PERMISSION_GRANTED) {
                              callback.invoke(origin, true, false);
                          } else {
                              ActivityCompat.requestPermissions(MainActivity.this,
                                      new String[]{Manifest.permission.ACCESS_FINE_LOCATION},
                                      LOCATION_PERMISSION_REQUEST);
                          }
                      }

                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          request.grant(request.getResources());
                      }
                  });

                  // Request notif permission Android 13+
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this,
                              Manifest.permission.POST_NOTIFICATIONS)
                              != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this,
                                  new String[]{Manifest.permission.POST_NOTIFICATIONS},
                                  NOTIFICATION_PERMISSION_REQUEST);
                      }
                  }

                  webView.loadUrl("https://yonymarciano-source.github.io/amal-tracker");
              }

              @Override
              public void onRequestPermissionsResult(int requestCode,
                      String[] permissions, int[] grantResults) {
                  if (requestCode == LOCATION_PERMISSION_REQUEST && geoCallback != null) {
                      boolean granted = grantResults.length > 0
                              && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                      geoCallback.invoke(geoOrigin, granted, false);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          # styles.xml
          cat > twa-project/app/src/main/res/values/styles.xml << 'EOF'
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">#0D3320</item>
                  <item name="colorPrimaryDark">#0D3320</item>
                  <item name="colorAccent">#C9941A</item>
                  <item name="android:windowBackground">#0D3320</item>
              </style>
          </resources>
          EOF

          # strings.xml
          cat > twa-project/app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">30 Hari Amal Terbaik</string>
          </resources>
          EOF

          # splash drawable
          cat > twa-project/app/src/main/res/drawable/splash.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#0D3320"/>
          </shape>
          EOF

          # icon
          cp icon-192.png twa-project/app/src/main/res/mipmap-hdpi/ic_launcher.png 2>/dev/null || \
            curl -sL -o twa-project/app/src/main/res/mipmap-hdpi/ic_launcher.png \
              https://yonymarciano-source.github.io/amal-tracker/icon-192.png

      - name: Build APK
        run: |
          cd twa-project
          ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Find APK
        run: find twa-project -name "*.apk" | head -10

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmalTracker-WebView-APK
          path: twa-project/**/*.apk
          retention-days: 90
          if-no-files-found: warn
