name: Build TWA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUBBLEWRAP_SKIP_UPDATE_CHECK: "true"
  BUBBLEWRAP_ANALYTICS: "false"
  JAVA_HOME_PATH: "/usr/lib/jvm/temurin-17-jdk-amd64"
  ANDROID_SDK_PATH: "/usr/local/lib/android/sdk"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          accept-android-sdk-licenses: true

      - name: Install Android build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Install Bubblewrap & expect
        run: |
          npm install -g @bubblewrap/cli@latest
          sudo apt-get install -y expect

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore android.keystore \
            -alias amaltracker \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass amaltracker123 \
            -keypass amaltracker123 \
            -dname "CN=Amal Tracker, OU=QLA Channel, O=Marc, L=Jakarta, S=DKI Jakarta, C=ID"

      - name: Create local manifest.json
        run: |
          # Embed manifest langsung — tidak fetch dari Netlify
          cat > web-manifest.json << 'WMANIFEST'
          {
            "name": "30 Hari Amal Terbaik",
            "short_name": "Amal Tracker",
            "description": "Muslim Habit Tracker — Tracker Ibadah & Amalan Harian 30 Hari",
            "start_url": "/",
            "scope": "/",
            "display": "standalone",
            "background_color": "#0D3320",
            "theme_color": "#0D3320",
            "orientation": "portrait-primary",
            "lang": "id",
            "icons": [
              { "src": "https://moslem-tracker-30days.netlify.app/icon-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any" },
              { "src": "https://moslem-tracker-30days.netlify.app/icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any" },
              { "src": "https://moslem-tracker-30days.netlify.app/icon-192.png", "sizes": "192x192", "type": "image/png", "purpose": "maskable" },
              { "src": "https://moslem-tracker-30days.netlify.app/icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "maskable" }
            ]
          }
          WMANIFEST
          # Serve manifest lokal via Python HTTP server
          python3 -m http.server 8080 &
          sleep 2
          curl -s http://localhost:8080/web-manifest.json | head -5

      - name: Init Bubblewrap with expect
        run: |
          mkdir -p twa-build

          expect << 'EXPECTSCRIPT'
          set timeout 120
          set JAVA "/usr/lib/jvm/temurin-17-jdk-amd64"
          set SDK  "/usr/local/lib/android/sdk"

          spawn sh -c "cd twa-build && bubblewrap init --manifest http://localhost:8080/web-manifest.json --directory . --skipPwaValidation"

          expect {
            -re "install the JDK.*\(Y/n\)" { send "No\r"; exp_continue }
            -re "Path to your existing JDK" { send "/usr/lib/jvm/temurin-17-jdk-amd64\r"; exp_continue }
            -re "Path to.*Android SDK"      { send "/usr/local/lib/android/sdk\r"; exp_continue }
            -re "packageId"                 { send "com.qla.amaltracker\r"; exp_continue }
            eof { }
          }
          EXPECTSCRIPT

      - name: Patch twa-manifest.json
        run: |
          cd twa-build
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('twa-manifest.json','utf8'));
            m.packageId = 'com.qla.amaltracker';
            m.host = 'moslem-tracker-30days.netlify.app';
            m.name = '30 Hari Amal Terbaik';
            m.launcherName = 'Amal Tracker';
            m.themeColor = '#0D3320';
            m.backgroundColor = '#0D3320';
            m.navigationColor = '#0D3320';
            m.enableNotifications = true;
            m.signingKey = { path: '../android.keystore', alias: 'amaltracker' };
            m.signingKeyPassword = 'amaltracker123';
            m.signingStorePassword = 'amaltracker123';
            m.features = { locationDelegation: { enabled: true } };
            m.minSdkVersion = 19;
            m.targetSdkVersion = 34;
            m.appVersionName = '1.0.0';
            m.appVersionCode = 1;
            fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
            console.log('Patched OK');
          "
          cat twa-manifest.json

      - name: Build APK with expect
        run: |
          expect << 'EXPECTSCRIPT'
          set timeout 600
          spawn sh -c "cd twa-build && bubblewrap build --skipPwaValidation"
          expect {
            -re "install the JDK.*\(Y/n\)" { send "No\r"; exp_continue }
            -re "Path to your existing JDK" { send "/usr/lib/jvm/temurin-17-jdk-amd64\r"; exp_continue }
            -re "Path to.*Android SDK"      { send "/usr/local/lib/android/sdk\r"; exp_continue }
            eof { }
          }
          EXPECTSCRIPT

      - name: Find APK files
        run: find . -name "*.apk" -o -name "*.aab" | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmalTracker-v1.0-APK
          path: |
            twa-build/app-release-signed.apk
            twa-build/app-release-unsigned.apk
            twa-build/**/*.apk
          retention-days: 90
          if-no-files-found: warn
