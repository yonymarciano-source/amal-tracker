name: Build TWA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          accept-android-sdk-licenses: true

      - name: Install Android build tools
        run: |
          sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@latest
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: "true"

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore android.keystore \
            -alias amaltracker \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass amaltracker123 \
            -keypass amaltracker123 \
            -dname "CN=Amal Tracker, OU=QLA Channel, O=Marc, L=Jakarta, S=DKI Jakarta, C=ID"

      - name: Init Bubblewrap
        run: |
          mkdir twa-build && cd twa-build
          bubblewrap init \
            --manifest "https://moslem-tracker-30days.netlify.app/manifest.json" \
            --directory . \
            --skipPwaValidation
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: "true"
          BUBBLEWRAP_ANALYTICS: "false"

      - name: Patch twa-manifest.json
        run: |
          cd twa-build
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('twa-manifest.json','utf8'));
            m.packageId = 'com.qla.amaltracker';
            m.name = '30 Hari Amal Terbaik';
            m.launcherName = 'Amal Tracker';
            m.themeColor = '#0D3320';
            m.backgroundColor = '#0D3320';
            m.navigationColor = '#0D3320';
            m.enableNotifications = true;
            m.signingKey = { path: '../android.keystore', alias: 'amaltracker' };
            m.signingKeyPassword = 'amaltracker123';
            m.signingStorePassword = 'amaltracker123';
            m.features = { locationDelegation: { enabled: true } };
            m.minSdkVersion = 19;
            m.targetSdkVersion = 34;
            m.appVersionName = '1.0.0';
            m.appVersionCode = 1;
            fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
            console.log('Manifest patched OK');
            console.log(JSON.stringify(m, null, 2));
          "

      - name: Build APK
        run: |
          cd twa-build
          bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: "true"
          BUBBLEWRAP_ANALYTICS: "false"

      - name: Find APK files
        run: find . -name "*.apk" -o -name "*.aab" | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmalTracker-v1.0-APK
          path: |
            twa-build/app-release-signed.apk
            twa-build/app-release-unsigned.apk
            twa-build/**/*.apk
          retention-days: 90
          if-no-files-found: warn
