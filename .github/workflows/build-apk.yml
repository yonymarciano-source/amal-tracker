name: Build WebView APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          accept-android-sdk-licenses: true

      - name: Install Android build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Restore keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app.keystore

      - name: Build WebView Android project
        run: |
          mkdir -p twa-project/app/src/main/java/com/qla/amaltracker
          mkdir -p twa-project/app/src/main/res/values
          mkdir -p twa-project/app/src/main/res/drawable
          mkdir -p twa-project/app/src/main/res/mipmap-hdpi
          mkdir -p twa-project/app/src/main/res/xml
          mkdir -p twa-project/gradle/wrapper

          cat > twa-project/gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > twa-project/settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AmalTracker"
          include ':app'
          EOF

          cat > twa-project/build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          cat > twa-project/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -sL -o twa-project/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar
          curl -sL -o twa-project/gradlew \
            https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew
          chmod +x twa-project/gradlew

          cat > twa-project/app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.qla.amaltracker'
              compileSdk 34
              defaultConfig {
                  applicationId "com.qla.amaltracker"
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName "1.1.0"
              }
              signingConfigs {
                  release {
                      storeFile file("../../app.keystore")
                      storePassword "amaltracker123"
                      keyAlias "amaltracker"
                      keyPassword "amaltracker123"
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.8.0'
          }
          EOF

          # AndroidManifest.xml - tambah RECEIVE_BOOT_COMPLETED dan SCHEDULE_EXACT_ALARM
          cat > twa-project/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:hardwareAccelerated="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <!-- BroadcastReceiver untuk terima alarm -->
                  <receiver
                      android:name=".NotifReceiver"
                      android:exported="false"/>
                  <!-- BroadcastReceiver untuk reschedule setelah reboot -->
                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # MainActivity.java - setup AlarmManager dari JS Interface
          cat > twa-project/app/src/main/java/com/qla/amaltracker/MainActivity.java << 'EOF'
          package com.qla.amaltracker;

          import android.app.Activity;
          import android.app.AlarmManager;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.Calendar;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final int LOC_REQ = 1;
              private static final int NOTIF_REQ = 2;
              private GeolocationPermissions.Callback geoCallback;
              private String geoOrigin;
              public static final String CHANNEL_ID = "amal_tracker_notif";
              public static final String PREFS = "amal_notif_prefs";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  createNotifChannel();

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setGeolocationEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);

                  // JS Interface untuk schedule notif dari JavaScript
                  webView.addJavascriptInterface(new NotifBridge(this), "AndroidNotif");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {
                          return false;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin,
                              GeolocationPermissions.Callback callback) {
                          geoOrigin = origin;
                          geoCallback = callback;
                          if (ContextCompat.checkSelfPermission(MainActivity.this,
                                  Manifest.permission.ACCESS_FINE_LOCATION)
                                  == PackageManager.PERMISSION_GRANTED) {
                              callback.invoke(origin, true, false);
                          } else {
                              ActivityCompat.requestPermissions(MainActivity.this,
                                      new String[]{Manifest.permission.ACCESS_FINE_LOCATION}, LOC_REQ);
                          }
                      }

                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          request.grant(request.getResources());
                      }
                  });

                  // Request notif permission Android 13+
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this,
                              Manifest.permission.POST_NOTIFICATIONS)
                              != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this,
                                  new String[]{Manifest.permission.POST_NOTIFICATIONS}, NOTIF_REQ);
                      }
                  }

                  webView.loadUrl("https://yonymarciano-source.github.io/amal-tracker/");
              }

              private void createNotifChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel(
                              CHANNEL_ID, "Pengingat Ibadah",
                              NotificationManager.IMPORTANCE_HIGH);
                      ch.setDescription("Notifikasi pengingat ibadah harian");
                      ch.enableVibration(true);
                      ch.setShowBadge(true);
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      nm.createNotificationChannel(ch);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int req, String[] perms, int[] results) {
                  if (req == LOC_REQ && geoCallback != null) {
                      boolean ok = results.length > 0 && results[0] == PackageManager.PERMISSION_GRANTED;
                      geoCallback.invoke(geoOrigin, ok, false);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              // JS Interface - dipanggil dari JavaScript
              public class NotifBridge {
                  private Context ctx;
                  NotifBridge(Context c) { ctx = c; }

                  @JavascriptInterface
                  public void scheduleNotifs(String jsonSchedule) {
                      try {
                          // Simpan schedule ke SharedPreferences
                          SharedPreferences prefs = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                          prefs.edit().putString("schedule", jsonSchedule).apply();

                          // Cancel semua alarm lama
                          cancelAllAlarms(ctx, jsonSchedule);

                          // Schedule alarm baru
                          JSONArray arr = new JSONArray(jsonSchedule);
                          AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);

                          for (int i = 0; i < arr.length(); i++) {
                              JSONArray item = arr.getJSONArray(i);
                              int hour = item.getInt(0);
                              int min  = item.getInt(1);
                              String title = item.getString(2);
                              String body  = item.getString(3);

                              Calendar cal = Calendar.getInstance();
                              cal.set(Calendar.HOUR_OF_DAY, hour);
                              cal.set(Calendar.MINUTE, min);
                              cal.set(Calendar.SECOND, 0);
                              cal.set(Calendar.MILLISECOND, 0);

                              // Kalau sudah lewat hari ini, schedule besok
                              if (cal.getTimeInMillis() <= System.currentTimeMillis()) {
                                  cal.add(Calendar.DAY_OF_YEAR, 1);
                              }

                              Intent intent = new Intent(ctx, NotifReceiver.class);
                              intent.putExtra("title", title);
                              intent.putExtra("body", body);
                              intent.putExtra("id", i);

                              PendingIntent pi = PendingIntent.getBroadcast(ctx, i, intent,
                                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                              // Repeating harian
                              am.setRepeating(AlarmManager.RTC_WAKEUP,
                                      cal.getTimeInMillis(),
                                      AlarmManager.INTERVAL_DAY,
                                      pi);
                          }
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  }

                  @JavascriptInterface
                  public void cancelNotifs() {
                      SharedPreferences prefs = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                      String saved = prefs.getString("schedule", "[]");
                      cancelAllAlarms(ctx, saved);
                      prefs.edit().remove("schedule").apply();
                  }
              }

              public static void cancelAllAlarms(Context ctx, String jsonSchedule) {
                  try {
                      AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                      JSONArray arr = new JSONArray(jsonSchedule);
                      for (int i = 0; i < arr.length(); i++) {
                          Intent intent = new Intent(ctx, NotifReceiver.class);
                          PendingIntent pi = PendingIntent.getBroadcast(ctx, i, intent,
                                  PendingIntent.FLAG_NO_CREATE | PendingIntent.FLAG_IMMUTABLE);
                          if (pi != null) am.cancel(pi);
                      }
                  } catch (Exception e) { e.printStackTrace(); }
              }
          }
          EOF

          # NotifReceiver.java - tampilkan notifikasi
          cat > twa-project/app/src/main/java/com/qla/amaltracker/NotifReceiver.java << 'EOF'
          package com.qla.amaltracker;

          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import androidx.core.app.NotificationCompat;

          public class NotifReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context ctx, Intent intent) {
                  String title = intent.getStringExtra("title");
                  String body  = intent.getStringExtra("body");
                  int id       = intent.getIntExtra("id", 0);

                  Intent openIntent = new Intent(ctx, MainActivity.class);
                  openIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(ctx, id, openIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(ctx, MainActivity.CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setAutoCancel(true)  // hilang setelah di-tap
                          .setOngoing(false)    // bisa di-swipe clear
                          .setContentIntent(pi)
                          .setVibrate(new long[]{0, 300, 200, 300});

                  NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                  nm.notify(id, builder.build());
              }
          }
          EOF

          # BootReceiver.java - reschedule setelah HP restart
          cat > twa-project/app/src/main/java/com/qla/amaltracker/BootReceiver.java << 'EOF'
          package com.qla.amaltracker;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import org.json.JSONArray;
          import java.util.Calendar;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context ctx, Intent intent) {
                  if (!Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) return;
                  SharedPreferences prefs = ctx.getSharedPreferences(MainActivity.PREFS, Context.MODE_PRIVATE);
                  String saved = prefs.getString("schedule", null);
                  if (saved == null) return;

                  try {
                      JSONArray arr = new JSONArray(saved);
                      AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);

                      for (int i = 0; i < arr.length(); i++) {
                          JSONArray item = arr.getJSONArray(i);
                          int hour = item.getInt(0);
                          int min  = item.getInt(1);
                          String title = item.getString(2);
                          String body  = item.getString(3);

                          Calendar cal = Calendar.getInstance();
                          cal.set(Calendar.HOUR_OF_DAY, hour);
                          cal.set(Calendar.MINUTE, min);
                          cal.set(Calendar.SECOND, 0);
                          if (cal.getTimeInMillis() <= System.currentTimeMillis()) {
                              cal.add(Calendar.DAY_OF_YEAR, 1);
                          }

                          Intent ni = new Intent(ctx, NotifReceiver.class);
                          ni.putExtra("title", title);
                          ni.putExtra("body", body);
                          ni.putExtra("id", i);

                          PendingIntent pi = PendingIntent.getBroadcast(ctx, i, ni,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                          am.setRepeating(AlarmManager.RTC_WAKEUP, cal.getTimeInMillis(),
                                  AlarmManager.INTERVAL_DAY, pi);
                      }
                  } catch (Exception e) { e.printStackTrace(); }
              }
          }
          EOF

          # styles.xml
          cat > twa-project/app/src/main/res/values/styles.xml << 'EOF'
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">#0D3320</item>
                  <item name="colorPrimaryDark">#0D3320</item>
                  <item name="colorAccent">#C9941A</item>
                  <item name="android:windowBackground">#0D3320</item>
              </style>
          </resources>
          EOF

          cat > twa-project/app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">30 Hari Amal Terbaik</string>
          </resources>
          EOF

          cat > twa-project/app/src/main/res/drawable/splash.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#0D3320"/>
          </shape>
          EOF

          cat > twa-project/app/src/main/res/xml/provider_paths.xml << 'EOF'
          <paths><external-path name="external_files" path="."/></paths>
          EOF

          cp icon-192.png twa-project/app/src/main/res/mipmap-hdpi/ic_launcher.png 2>/dev/null || \
            curl -sL -o twa-project/app/src/main/res/mipmap-hdpi/ic_launcher.png \
              https://yonymarciano-source.github.io/amal-tracker/icon-192.png

      - name: Build APK
        run: |
          cd twa-project
          ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Find APK
        run: find twa-project -name "*.apk" | head -10

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmalTracker-v1.1-APK
          path: twa-project/**/*.apk
          retention-days: 90
          if-no-files-found: warn
